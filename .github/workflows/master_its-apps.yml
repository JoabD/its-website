# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# CI/CD real (ver docs/Plan-SEO-Google-Search.md): este es el único workflow que de verdad se
# ejecuta hoy (dispara con push a `master`, que es la rama real del repo — los otros dos archivos
# de este folder apuntaban a `main`, que no existe, así que nunca corrían). Antes solo hacía
# build + deploy, sin ninguna prueba antes — cualquier cosa que rompiera un test se enteraba
# hasta que ya estaba en producción. Se agregó el job `test` (las mismas pruebas de ci.yml) y
# `build`/`deploy` ahora dependen de él (`needs`) — si algo falla, no se despliega. `paths:
# backend/**` evita reconstruir y redesplegar el backend en cada push que solo toca el frontend
# (antes corría siempre, sin importar qué hubiera cambiado).

name: Build, test and deploy backend to Azure Web App - its-apps

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Jwt:SigningKey vive solo en appsettings.Development.json (git-ignored, R8: nunca un secreto
    # real versionado) — por eso nunca llega a CI. Shekinah.Api.FunctionalTests levanta Program.cs
    # completo vía WebApplicationFactory, y AddShekinahAuth explota si esa clave no está configurada
    # (aunque los tests en sí no emitan tokens). Se inyecta aquí una clave de prueba, sin ningún
    # significado fuera de este job — no es la clave real de producción, así que no hace falta un
    # GitHub secret para esto.
    env:
      Jwt__SigningKey: "ci-test-signing-key-nunca-usada-en-produccion-32chars-min"
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        working-directory: backend
        run: dotnet restore Shekinah.sln

      - name: Build (Release)
        working-directory: backend
        run: dotnet build Shekinah.sln --no-restore -c Release

      # Domain.UnitTests y Architecture.Tests no requieren infraestructura externa.
      - name: Unit + architecture tests
        working-directory: backend
        run: |
          dotnet test tests/Shekinah.Domain.UnitTests/Shekinah.Domain.UnitTests.csproj --no-build -c Release
          dotnet test tests/Shekinah.Architecture.Tests/Shekinah.Architecture.Tests.csproj --no-build -c Release
          dotnet test tests/Shekinah.Application.UnitTests/Shekinah.Application.UnitTests.csproj --no-build -c Release

      # Requieren Docker (Testcontainers / WebApplicationFactory contra Mongo real) — los runners
      # hospedados de GitHub sí traen Docker.
      - name: Integration + functional tests
        working-directory: backend
        run: |
          dotnet test tests/Shekinah.Infrastructure.IntegrationTests/Shekinah.Infrastructure.IntegrationTests.csproj -c Release
          dotnet test tests/Shekinah.Api.FunctionalTests/Shekinah.Api.FunctionalTests.csproj -c Release

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build backend/src/Shekinah.Api/Shekinah.Api.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish backend/src/Shekinah.Api/Shekinah.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'its-apps'
          slot-name: 'Production'
          package: .