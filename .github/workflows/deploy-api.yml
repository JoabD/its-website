name: Deploy API (deshabilitado — ver master_its-apps.yml)

# DESHABILITADO (ver docs/Plan-SEO-Google-Search.md, sección CI/CD): este workflow apuntaba a
# `branches: [main]`, que no existe en este repo (la rama real es `master`), así que nunca se había
# ejecutado — y además usa un secreto, AZURE_WEBAPP_PUBLISH_PROFILE, que no está configurado en
# Settings → Secrets → Actions (ahí solo existen AZURE_CLIENT_ID/AZURE_TENANT_ID/
# AZURE_SUBSCRIPTION_ID, que sí usa master_its-apps.yml). El despliegue real del backend a Azure ya
# lo hace master_its-apps.yml, con pruebas obligatorias antes de desplegar — dos workflows
# desplegando al mismo Azure Web App competirían entre sí. Se deja solo con `workflow_dispatch`
# (disparo manual desde la pestaña Actions de GitHub) por si algún día se vuelve a necesitar; si no,
# puedes borrar este archivo sin problema.

on:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: shekinah-its-api # cambia esto por el nombre real de tu App Service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        working-directory: backend
        run: dotnet publish src/Shekinah.Api/Shekinah.Api.csproj -c Release -o ${{ github.workspace }}/publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish

# Variables de entorno que este App Service necesita configuradas en su panel (Configuration →
# Application settings), NUNCA en este archivo ni en el repositorio (R8):
#   Mongo__ConnectionString        = mongodb+srv://... (cadena SRV real de tu clúster Atlas M0)
#   Jwt__SigningKey                = clave real ≥32 caracteres
#   EmailSettings__SenderAppPassword = tu app password real de Gmail
#   Seed__AdminPassword            = contraseña temporal real del admin semilla